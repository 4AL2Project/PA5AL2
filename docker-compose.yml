# Compose racine : lance les deux frontends (Next.js).
# - frontend       (application pharmacie)  → http://localhost:3000
# - frontend-asso  (application association) → http://localhost:3001
#
#   docker compose -f backend/docker-compose.services.yml up -d   # requis d'abord
#   docker compose up --build
#
# Le backend est joint par DEUX chemins distincts, à ne pas confondre :
#
#   NEXT_PUBLIC_API_URL  → depuis le NAVIGATEUR, via le port publié
#                          (http://localhost:3005). Inliné dans le bundle au build.
#   API_INTERNAL_URL     → depuis le SERVEUR Next (Server Components, route
#                          handlers), via le réseau Docker (http://api:3005).
#                          Lu au runtime : `localhost` y désigne le conteneur
#                          frontend lui-même, pas l'API.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3005}
        # NEXT_PUBLIC_* est inliné au build : doit être un build arg, pas une
        # variable runtime, sinon le bundle client garde le défaut (false) et
        # le lien « Développeur » du nav admin n'apparaît pas.
        NEXT_PUBLIC_DEV_TOOLS_ENABLED: ${NEXT_PUBLIC_DEV_TOOLS_ENABLED:-true}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3005}
    restart: unless-stopped
    ports:
      - '3000:3000'
    networks:
      - default
      - backend

  frontend-asso:
    build:
      context: ./frontend-asso
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3005}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - '3001:3001'
    networks:
      - default
      - backend

# Réseau créé par backend/docker-compose.services.yml (projet `backend`).
networks:
  backend:
    name: backend_default
    external: true
